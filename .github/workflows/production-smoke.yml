name: VelCli production smoke test
on:
  push:
    branches: [main]
    paths:
      - ".node-version"
      - "package.json"
      - "apps/**"
      - "packages/**"
      - "scripts/production-smoke.mjs"
      - "velcli/**"
      - "render.yaml"
      - ".github/workflows/production-smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify live production health and PostgreSQL persistence
        run: node scripts/production-smoke.mjs
