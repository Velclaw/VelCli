name: VelCli Build and API tests
on:
  push:
    paths:
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "apps/**"
      - "packages/**"
      - "scripts/**"
      - "velcli/**"
      - "render.yaml"
      - ".github/workflows/velcli-cli.yml"
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "apps/**"
      - "packages/**"
      - "scripts/**"
      - "velcli/**"
      - "render.yaml"
      - ".github/workflows/velcli-cli.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: \${{ matrix.node-version }}
      - name: Install root dependencies
        run: npm install
      - name: Build, API smoke tests, CLI and policy tests
        run: npm test
      - name: Verify CLI entry point
        run: node velcli/src/cli.mjs help
