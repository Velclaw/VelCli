name: VelCli Build CLI
on:
  push:
    paths:
      - "velcli/**"
      - ".github/workflows/velcli-cli.yml"
  pull_request:
    paths:
      - "velcli/**"
      - ".github/workflows/velcli-cli.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run CLI tests
        working-directory: velcli
        run: npm test
      - name: Verify help command
        working-directory: velcli
        run: node src/cli.mjs help
