<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1"><title>VelCli</title><style>body{margin:0;background:#07080d;color:#f5f7ff;font:15px system-ui}main{max-width:900px;margin:auto;padding:48px 20px}.logo{font-size:28px;font-weight:800}.muted{color:#8d94a5}.box{margin-top:30px;padding:16px;border:1px solid #292d38;border-radius:18px;background:#0d1017}textarea{width:100%;min-height:120px;background:transparent;border:0;outline:0;color:white;font:inherit;resize:vertical}.run{margin-top:10px;padding:12px 18px;border:0;border-radius:12px;font-weight:700}.event{margin-top:10px;padding:12px;border:1px solid #242833;border-radius:12px;background:#0b0e14}</style><main><div class=logo>VELCLI</div><div class=muted>Autonomous Engineering Agent · VELCLAW</div><h1>What are we building?</h1><div class=box><textarea id=p placeholder="Describe what you want VelCli to build..."></textarea><button class=run onclick=run()>Run Agent</button></div><div id=e></div></main><script>async function run(){e.innerHTML='<div class=event>Running…</div>';try{let r=await fetch('/api/agent',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({prompt:p.value})});let j=await r.json();e.innerHTML=(j.events||[]).map(x=>'<div class=event><b>'+x.type+'</b><br>'+(x.message||x.error||'')+'</div>').join('')}catch(x){e.innerHTML='<div class=event>'+x+'</div>'}}</script></html>
